name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm run setup

      - name: Seed database with test dataset
        run: npm run seed

      - name: Run E2E API Smoke Tests (76 assertions)
        run: npm test

  build:
    name: Build & Artifact Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm run setup

      - name: Build client production assets
        run: npm run build

      - name: Verify build distribution
        run: |
          test -d client/dist
          test -f client/dist/index.html
          echo "Client production bundle built successfully."

      - name: Upload production client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  docker:
    name: Docker Container Build & Run
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t brightloop:latest .

      - name: Test Docker container run & health
        run: |
          docker run -d --name test-app -p 4000:4000 brightloop:latest
          sleep 6
          curl -f http://127.0.0.1:4000/api/health || (docker logs test-app && exit 1)
          docker rm -f test-app


