services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brightloop:latest
    container_name: brightloop-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    volumes:
      - brightloop-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  brightloop-data:
    name: brightloop-data
    driver: local
